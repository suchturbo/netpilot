[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpilot"
version = "0.1.0"
description = "A conversational agent for network devices with a deterministic safety layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuchir Harsha" }]
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
netpilot = "netpilot.cli:main"

[tool.setuptools.packages.find]
include = ["netpilot*"]

[tool.setuptools.package-data]
netpilot = ["runbooks/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
